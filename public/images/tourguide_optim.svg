<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="TourGuide : temps de traitement avant et après optimisation pour 100 000 utilisateurs">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2536f5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2536f5" stop-opacity="0" />
    </radialGradient>
    <style>
      .font { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 60px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .eyebrow { font-size: 22px; font-weight: 600; fill: #8e97b8; letter-spacing: 6px; }
      .sub { font-size: 25px; fill: #8e97b8; }
      .panel-title { font-size: 36px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
      .badge { font-size: 26px; font-weight: 700; fill: #7f95ff; }
      .label { font-size: 21px; font-weight: 600; fill: #8e97b8; letter-spacing: 3px; }
      .value { font-size: 27px; font-weight: 700; fill: #f0f2fa; font-variant-numeric: tabular-nums; }
      .note { font-size: 21px; fill: #8e97b8; }
      .foot { font-size: 21px; fill: #8e97b8; }
      .pill-text { font-size: 20px; fill: #c3cae3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0c1021" />
  <circle cx="1440" cy="40" r="430" fill="url(#glow)" />

  <!-- Header -->
  <g class="font">
    <text class="eyebrow" x="90" y="112">TOURGUIDE · SPRING BOOT</text>
    <text class="title" x="90" y="188">100 000 utilisateurs, 128× plus rapides</text>
    <text class="sub" x="90" y="240">Temps de traitement en secondes, chaque barre ramenée au temps avant optimisation.</text>
  </g>

  <!-- Panel: localisations -->
  <g class="font">
    <rect x="90" y="310" width="700" height="400" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text class="panel-title" x="130" y="385">Localisations</text>
    <rect x="650" y="345" width="100" height="48" rx="24" fill="#7f95ff" fill-opacity="0.15" />
    <text class="badge" x="700" y="378" text-anchor="middle">×38</text>

    <text class="label" x="130" y="452">AVANT</text>
    <text class="value" x="750" y="452" text-anchor="end">7 579 s</text>
    <rect x="130" y="468" width="620" height="40" rx="6" fill="#f26d6d" />

    <text class="label" x="130" y="568">APRÈS</text>
    <text class="value" x="750" y="568" text-anchor="end">199 s</text>
    <rect x="130" y="584" width="16.3" height="40" rx="6" fill="#7f95ff" />

    <text class="note" x="130" y="672">2,6 % du temps initial</text>
  </g>

  <!-- Panel: récompenses -->
  <g class="font">
    <rect x="810" y="310" width="700" height="400" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text class="panel-title" x="850" y="385">Récompenses</text>
    <rect x="1370" y="345" width="100" height="48" rx="24" fill="#7f95ff" fill-opacity="0.15" />
    <text class="badge" x="1420" y="378" text-anchor="middle">×128</text>

    <text class="label" x="850" y="452">AVANT</text>
    <text class="value" x="1470" y="452" text-anchor="end">64 020 s</text>
    <rect x="850" y="468" width="620" height="40" rx="6" fill="#f26d6d" />

    <text class="label" x="850" y="568">APRÈS</text>
    <text class="value" x="1470" y="568" text-anchor="end">500 s</text>
    <rect x="850" y="584" width="6" height="40" rx="3" fill="#7f95ff" />

    <text class="note" x="850" y="672">0,8 % du temps initial</text>
  </g>

  <!-- Footer -->
  <g class="font">
    <line x1="90" y1="748" x2="1510" y2="748" stroke="#ffffff" stroke-opacity="0.08" />
    <text class="foot" x="90" y="798">Méthode : passage au parallèle (ExecutorService, CompletableFuture.allOf), tests stabilisés avec CopyOnWriteArrayList.</text>

    <rect x="90" y="826" width="550" height="48" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text class="pill-text" x="116" y="856">Pipeline CI/CD — GitHub Actions · GitLab · Jenkins</text>

    <rect x="665" y="826" width="360" height="48" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text class="pill-text" x="691" y="856">Documentation Swagger / OpenAPI</text>

    <rect x="1050" y="826" width="450" height="48" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text class="pill-text" x="1076" y="856">Tracker planifié (@PostConstruct, 5 min)</text>
  </g>
</svg>
