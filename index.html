<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Fouad Benhadda — Portfolio</title>
    <script>
      // Theme: the visitor's saved choice wins, otherwise follow the system. Runs before first paint (no flash).
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const readSavedTheme = () => {
        try {
          return localStorage.getItem('theme');
        } catch {
          return null;
        }
      };
      const applyTheme = () => {
        const saved = readSavedTheme();
        const isDark = saved ? saved === 'dark' : media.matches;
        document.documentElement.classList.toggle('dark', isDark);
      };
      applyTheme();
      media.addEventListener('change', applyTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
